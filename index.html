<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MP3 분석 리듬게임 (HELL)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body {
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            /* 💡 치트키: 화면 밀림 및 롱터치 컨텍스트 메뉴 차단 */
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 💡 반응형 구조: 스마트폰 전체 화면 높이에 부드럽게 맞춤 */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100vw;
            height: 100vh;
            padding: 15px 10px;
            box-sizing: border-box;
        }

        h1 {
            margin: 0;
            color: #00e5ff;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(20px, 6vw, 30px);
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00e5ff;
            text-align: center;
        }

        /* 💡 반응형 세로 레이아웃: 화면 크기에 맞춰 게임 영역이 자동으로 최적화됨 */
        .game-wrapper {
            position: relative;
            background-color: #05050a;
            border: 2px solid rgba(0, 229, 255, 0.4);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
            width: 100%;
            max-width: 420px; /* PC나 태블릿에서도 보기 좋게 최대 너비 고정 */
            flex: 1; /* 가용 공간을 채워 세로로 길어짐 */
            margin: 10px 0;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: transparent;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 7, 15, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .overlay h2 {
            color: #00e5ff;
            margin: 0 0 20px 0;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(22px, 6vw, 32px);
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.8);
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            margin-bottom: 20px;
        }

        .btn {
            border: 1px solid #00e5ff;
            color: #ffffff;
            background: linear-gradient(45deg, rgba(0, 229, 255, 0.2) 0%, rgba(0, 229, 255, 0.5) 100%);
            padding: 15px 30px;
            font-size: 15px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .btn:hover {
            background: linear-gradient(45deg, rgba(0, 229, 255, 0.5) 0%, rgba(0, 229, 255, 0.8) 100%);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.8);
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
            width: 100%;
        }

        #status-text {
            color: #ffeb3b;
            margin-bottom: 20px;
            font-size: 14px;
            text-shadow: 0 0 5px #ffeb3b;
        }

        .hud-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 6px;
            padding: 10px 15px;
        }

        #score-board, #stats-board {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(13px, 3.8vw, 16px);
            font-weight: 700;
            white-space: nowrap;
        }

        #score-board { color: #ffaa00; text-shadow: 0 0 10px rgba(255, 170, 0, 0.6); }
        #stats-board { color: #00ffaa; text-shadow: 0 0 5px rgba(0, 255, 170, 0.5); }

        #quit-btn {
            background: linear-gradient(45deg, rgba(255, 0, 85, 0.3) 0%, rgba(255, 0, 85, 0.6) 100%);
            color: #fff;
            border: 1px solid #ff0055;
            padding: 10px;
            font-size: 14px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            letter-spacing: 1px;
        }

        .key {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #555;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
        }

        .difficulty-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 280px;
        }

        .diff-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #aaa;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            border-radius: 4px;
        }

        .diff-btn.active {
            border-color: #00e5ff;
            background: rgba(0, 229, 255, 0.2);
            color: #00e5ff;
        }

        .progress-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 25px;
            background: rgba(255, 255, 255, 0.03);
            z-index: 5;
            overflow: hidden;
            border-bottom: 1px solid rgba(0, 229, 255, 0.1);
        }

        #waveform-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.3;
        }

        #progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, rgba(0, 229, 255, 0.4), rgba(0, 255, 170, 0.4));
            border-right: 2px solid #00e5ff;
            z-index: 2;
        }
    </style>
</head>

<body>

    <div class="main-container">
        <h1>RHYTHM GAME</h1>

        <div class="game-wrapper">
            <div class="progress-container">
                <canvas id="waveform-canvas"></canvas>
                <div id="progress-bar"></div>
            </div>
            <canvas id="game"></canvas>

            <div id="start-screen" class="overlay">
                <h2>RHYTHM GAME</h2>
                <div class="difficulty-selector">
                    <button class="diff-btn active" data-diff="easy">EASY</button>
                    <button class="diff-btn" data-diff="hard">HARD</button>
                </div>
                <p id="mode-desc" style="font-size: 13px; color: #ccc; margin-bottom: 20px; line-height: 1.6; padding: 0 10px;">
                    기초부터 차근차근! 입문자용 모드입니다.<br><br>
                    PC: <span class="key">D</span><span class="key">F</span><span class="key">J</span><span class="key">K</span><br>
                    모바일: 양손으로 쥐고 하단 판정 영역을 터치하세요!
                </p>
                <div class="upload-btn-wrapper">
                    <button class="btn">MP3 파일 선택</button>
                    <input type="file" id="audio-upload" accept="audio/mpeg, audio/mp3, audio/wav" />
                </div>
                <div id="status-text"></div>
            </div>
        </div>

        <div class="hud-container">
            <div class="hud-row">
                <div id="stats-board">RATE: 0%</div>
                <div id="score-board">SCORE: 0</div>
            </div>
            <button id="quit-btn" style="display: none;">EMERGENCY EXIT</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('audio-upload');
        const startScreen = document.getElementById('start-screen');
        const statusText = document.getElementById('status-text');
        const scoreBoard = document.getElementById('score-board');
        const statsBoard = document.getElementById('stats-board');
        const quitBtn = document.getElementById('quit-btn');
        const progressBar = document.getElementById('progress-bar');
        const waveformCanvas = document.getElementById('waveform-canvas');
        const waveCtx = waveformCanvas.getContext('2d');

        // 세로형 논리 해상도 고정
        canvas.width = 400;
        canvas.height = 600;

        let audioCtx;
        let sourceNode;
        let gameData = {
            notes: [],
            score: 0,
            isPlaying: false,
            startTime: 0,
            speed: 400,
            hitLineY: 520, // 하단 판정선 위치 (양손 엄지가 닿기 딱 좋은 곳)
            laneWidth: 100, // 400 / 4 레인 너비
            particles: [],
            successCount: 0,
            failCount: 0,
            bgStars: [],
            difficulty: 'easy',
            hitWindow: 0.15,
            greatWindow: 0.25,
            missWindow: 0.6,
            combo: 0,
            maxCombo: 0,
            judgmentAlpha: 0,
            duration: 0,
            lastVibrateTime: 0
        };

        const diffBtns = document.querySelectorAll('.diff-btn');
        const modeDesc = document.getElementById('mode-desc');
        diffBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                diffBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                gameData.difficulty = btn.dataset.diff;
                if (gameData.difficulty === 'easy') {
                    modeDesc.innerHTML = '기초부터 차근차근! 입문자용 모드입니다.<br><br>PC: <span class="key">D</span><span class="key">F</span><span class="key">J</span><span class="key">K</span><br>모바일: 양손으로 쥐고 하단 판정 영역을 터치하세요!';
                } else {
                    modeDesc.innerHTML = '빠른 박자와 높은 난이도! 숙련자용 모드입니다.<br><br>PC: <span class="key">D</span><span class="key">F</span><span class="key">J</span><span class="key">K</span><br>모바일: 양손으로 쥐고 하단 판정 영역을 터치하세요!';
                }
            });
        });

        function updateStats() {
            let total = gameData.successCount + gameData.failCount;
            let rate = total === 0 ? 0 : Math.round((gameData.successCount / total) * 100);
            statsBoard.innerText = `RATE: ${rate}% | COMBO: ${gameData.combo}`;
        }

        function showJudgment(text) {
            gameData.lastJudgment = text;
            gameData.judgmentAlpha = 1.0;
        }

        const keys = [false, false, false, false];
        const laneColors = ['#ff0055', '#00ffaa', '#0088ff', '#ffaa00'];

        fileInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            statusText.innerText = "음원 디코딩 및 음악 분석 중...";

            const reader = new FileReader();
            reader.onload = function (ev) {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                audioCtx.decodeAudioData(ev.target.result, async function (buffer) {
                    statusText.innerText = "리듬 비트 추출 중... 잠시만 기다려주세요!";
                    await analyzeVocalAndGenerateNotes(buffer);
                }, function (err) {
                    statusText.innerText = "오디오 오류: " + err;
                });
            };
            reader.readAsArrayBuffer(file);
            e.target.value = '';
        });

        async function analyzeVocalAndGenerateNotes(buffer) {
            const sampleRate = buffer.sampleRate;
            
            const vocalOffline = new OfflineAudioContext(buffer.numberOfChannels, buffer.length, sampleRate);
            const vocalSource = vocalOffline.createBufferSource();
            vocalSource.buffer = buffer;
            const hp = vocalOffline.createBiquadFilter();
            hp.type = 'highpass'; hp.frequency.value = 400;
            const lpV = vocalOffline.createBiquadFilter();
            lpV.type = 'lowpass'; lpV.frequency.value = 3000;
            vocalSource.connect(hp); hp.connect(lpV); lpV.connect(vocalOffline.destination);
            vocalSource.start(0);
            const renderedVocal = await vocalOffline.startRendering();
            const vocalData = renderedVocal.getChannelData(0);

            const kickOffline = new OfflineAudioContext(buffer.numberOfChannels, buffer.length, sampleRate);
            const kickSource = kickOffline.createBufferSource();
            kickSource.buffer = buffer;
            const lpK = kickOffline.createBiquadFilter();
            lpK.type = 'lowpass'; lpK.frequency.value = 150;
            kickSource.connect(lpK); lpK.connect(kickOffline.destination);
            kickSource.start(0);
            const renderedKick = await kickOffline.startRendering();
            const kickData = renderedKick.getChannelData(0);

            const step = Math.floor(sampleRate / 60); 
            gameData.notes = [];
            let lastVocalTime = -1;
            let lastKickTime = -1;
            let laneOccupiedUntil = [0, 0, 0, 0];

            function getNextAvailableLane(time) {
                let lane = Math.floor(Math.random() * 4);
                let attempts = 0;
                while (laneOccupiedUntil[lane] > time && attempts < 5) {
                    lane = Math.floor(Math.random() * 4);
                    attempts++;
                }
                return lane;
            }

            const isEasy = gameData.difficulty === 'easy';
            const kThresh = isEasy ? 0.28 : 0.22;
            const vThresh = isEasy ? 0.16 : 0.10;
            const minKGap = isEasy ? 0.5 : 0.3;
            const minVGap = isEasy ? 0.6 : 0.4;

            for (let i = 0; i < vocalData.length; i += step) {
                const currentTime = i / sampleRate;
                const hitTime = currentTime + 2.0;

                let activeHolds = laneOccupiedUntil.filter(t => t > currentTime).length;
                let fingerCapacity = Math.max(0, 2 - activeHolds);
                let notesAdded = 0;

                let kSum = 0;
                for (let j = 0; j < step && i + j < kickData.length; j++) kSum += kickData[i + j] * kickData[i + j];
                let kRms = Math.sqrt(kSum / step);
                
                if (kRms > kThresh && currentTime - lastKickTime > minKGap && notesAdded < fingerCapacity) {
                    let lane = getNextAvailableLane(currentTime);
                    if (laneOccupiedUntil[lane] <= currentTime) {
                        gameData.notes.push({ type: 'normal', lane: lane, hitTime: hitTime, active: true });
                        notesAdded++;
                        lastKickTime = currentTime;
                    }
                }

                let vSum = 0;
                for (let j = 0; j < step && i + j < vocalData.length; j++) vSum += vocalData[i + j] * vocalData[i + j];
                let vRms = Math.sqrt(vSum / step);

                if (vRms > vThresh && currentTime - lastVocalTime > minVGap && notesAdded < fingerCapacity) {
                    let lane = getNextAvailableLane(currentTime);
                    if (laneOccupiedUntil[lane] <= currentTime) {
                        let duration = isEasy ? 0.4 : 0.6;
                        gameData.notes.push({
                            type: 'long', lane: lane, hitTime: hitTime,
                            duration: duration, active: true, wasHit: false, heldDuration: 0
                        });
                        laneOccupiedUntil[lane] = currentTime + duration + 0.1;
                        lastVocalTime = currentTime;
                    }
                }
            }

            statusText.innerText = "분석 및 노트 생성 성공!";
            drawWaveform(buffer);
            startGame(buffer);
        }

        function drawWaveform(buffer) {
            const width = waveformCanvas.width = waveformCanvas.clientWidth;
            const height = waveformCanvas.height = waveformCanvas.clientHeight;
            const data = buffer.getChannelData(0);
            const step = Math.ceil(data.length / width);
            const amp = height / 2;

            waveCtx.clearRect(0, 0, width, height);
            waveCtx.beginPath();
            waveCtx.moveTo(0, amp);
            waveCtx.strokeStyle = 'rgba(0, 229, 255, 0.4)';
            waveCtx.lineWidth = 1;

            for (let i = 0; i < width; i++) {
                let min = 1.0, max = -1.0;
                for (let j = 0; j < step; j++) {
                    const datum = data[(i * step) + j];
                    if (datum < min) min = datum;
                    if (datum > max) max = datum;
                }
                waveCtx.lineTo(i, (1 + min) * amp);
                waveCtx.lineTo(i, (1 + max) * amp);
            }
            waveCtx.stroke();
        }

        function startGame(buffer) {
            startScreen.style.display = 'none';
            gameData.score = 0;
            gameData.successCount = 0;
            gameData.failCount = 0;
            gameData.particles = [];
            gameData.bgStars = [];
            scoreBoard.innerText = "SCORE: 0";
            updateStats();

            gameData.duration = buffer.duration;
            progressBar.style.width = "0%";

            if (gameData.difficulty === 'easy') {
                gameData.speed = 350; // 세로 화면에 딱 맞춘 안정적인 속도
                gameData.hitWindow = 0.16;
                gameData.greatWindow = 0.28;
            } else {
                gameData.speed = 500;
                gameData.hitWindow = 0.12;
                gameData.greatWindow = 0.24;
            }

            for (let i = 0; i < 40; i++) {
                gameData.bgStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: Math.random() * 0.5 + 0.2,
                    radius: Math.random() * 1.5 + 0.5
                });
            }

            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = buffer;
            sourceNode.connect(audioCtx.destination);

            gameData.startTime = audioCtx.currentTime + 2.0;
            sourceNode.start(gameData.startTime);

            gameData.isPlaying = true;
            gameData.combo = 0;
            gameData.maxCombo = 0;
            gameData.lastJudgment = "";
            gameData.judgmentAlpha = 0;
            quitBtn.style.display = 'inline-block';
            requestAnimationFrame(gameLoop);

            sourceNode.onended = () => { endGame(); };
        }

        function endGame() {
            if (!gameData.isPlaying) return;
            gameData.isPlaying = false;
            quitBtn.style.display = 'none';

            for (let i = 0; i < 100; i++) {
                gameData.particles.push({
                    x: canvas.width / 2, y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 16, vy: (Math.random() - 0.5) * 16,
                    radius: Math.random() * 12 + 4, alpha: 1, decay: 0.015,
                    color: laneColors[Math.floor(Math.random() * 4)]
                });
            }

            setTimeout(() => {
                let total = gameData.successCount + gameData.failCount;
                let rate = total === 0 ? 0 : Math.round((gameData.successCount / total) * 100);

                let h2 = startScreen.querySelector('h2');
                let p = startScreen.querySelector('p');
                if (h2) h2.innerHTML = `<span style="color:#ffeb3b;">CLEAR!</span> <span style="color:#00e5ff;">${rate}%</span>`;
                if (p) p.innerHTML = `최종 점수: ${gameData.score}<br><br>다른 음악 파일을 선택하여 플레이해 보세요!`;

                startScreen.style.display = 'flex';
            }, 1500);
        }

        quitBtn.addEventListener('click', () => { if (sourceNode && gameData.isPlaying) sourceNode.stop(); });

        function gameLoop() {
            if (!gameData.isPlaying && gameData.particles.length === 0) return;
            requestAnimationFrame(gameLoop);

            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 배경 별 연출
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            for (let i = 0; i < gameData.bgStars.length; i++) {
                let star = gameData.bgStars[i];
                star.y += star.speed; // 다시 위에서 아래로 흐르게 수정!
                if (star.y > canvas.height) star.y = 0;
                ctx.beginPath(); ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2); ctx.fill();
            }

            let currentTime = audioCtx.currentTime - gameData.startTime + 2.0;

            if (gameData.duration > 0) {
                let progress = Math.min(100, Math.max(0, (currentTime / (gameData.duration + 2.0)) * 100));
                progressBar.style.width = progress + "%";
            }

            // 4개 세로 레인 구분선 그리기
            for (let i = 1; i < 4; i++) {
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.12)';
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(i * gameData.laneWidth, 0); ctx.lineTo(i * gameData.laneWidth, canvas.height); ctx.stroke();
            }

            // 하단 판정선 그리기
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(0, gameData.hitLineY); ctx.lineTo(canvas.width, gameData.hitLineY); ctx.stroke();

            // 레인 입력 시 스포트라이트 및 광원 연출
            for (let i = 0; i < 4; i++) {
                let laneX = i * gameData.laneWidth + gameData.laneWidth / 2;

                if (keys[i]) {
                    let beamGrad = ctx.createLinearGradient(0, gameData.hitLineY, 0, 0);
                    beamGrad.addColorStop(0, laneColors[i]);
                    beamGrad.addColorStop(1, 'transparent');
                    ctx.fillStyle = beamGrad;
                    ctx.globalAlpha = 0.18;
                    ctx.fillRect(i * gameData.laneWidth, 0, gameData.laneWidth, gameData.hitLineY);
                    ctx.globalAlpha = 1.0;
                }

                let glowGrad = ctx.createRadialGradient(laneX, gameData.hitLineY, 0, laneX, gameData.hitLineY, keys[i] ? 45 : 25);
                glowGrad.addColorStop(0, '#fff');
                glowGrad.addColorStop(0.3, laneColors[i]);
                glowGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = glowGrad;
                ctx.beginPath(); ctx.arc(laneX, gameData.hitLineY, keys[i] ? 45 : 25, 0, Math.PI * 2); ctx.fill();
            }

            // 위에서 아래로 떨어지는 노트 처리
            for (let i = 0; i < gameData.notes.length; i++) {
                let note = gameData.notes[i];
                if (!note.active) continue;

                let timeDiff = note.hitTime - currentTime;
                let y = gameData.hitLineY - (timeDiff * gameData.speed);
                let x = note.lane * gameData.laneWidth + gameData.laneWidth / 2;

                if (note.type === 'normal') {
                    if (y > canvas.height + 30) {
                        note.active = false;
                        handleMiss();
                    } else if (y > -30) {
                        ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI * 2);
                        ctx.fillStyle = laneColors[note.lane];
                        ctx.shadowBlur = 8; ctx.shadowColor = laneColors[note.lane];
                        ctx.fill(); ctx.shadowBlur = 0;
                    }
                } 
                else if (note.type === 'long') {
                    let length = note.duration * gameData.speed;
                    let bottomY = y;
                    let topY = y - length;

                    if (topY > canvas.height) {
                        note.active = false;
                        if (!note.wasHit) handleMiss();
                    } else {
                        let drawBottomY = bottomY;

                        if (note.wasHit && bottomY > gameData.hitLineY) {
                            if (keys[note.lane]) {
                                if (!note._lastHoldTime) note._lastHoldTime = currentTime;
                                let delta = currentTime - note._lastHoldTime;
                                if (delta > 0) note.heldDuration += delta;
                                note._lastHoldTime = currentTime;
                            }
                            drawBottomY = gameData.hitLineY;

                            if (keys[note.lane] && bottomY >= gameData.hitLineY && topY <= gameData.hitLineY) {
                                gameData.score += 1;
                                scoreBoard.innerText = `SCORE: ${gameData.score}`;
                            }

                            if (topY >= gameData.hitLineY && !note.finishedBurst) {
                                note.finishedBurst = true;
                                if (note.heldDuration >= note.duration * 0.7) {
                                    gameData.successCount++; gameData.score += 35; updateStats();
                                } else {
                                    handleMiss();
                                }
                            }
                        }

                        let drawHeight = drawBottomY - topY;
                        if (drawHeight > 0 && topY <= gameData.hitLineY) {
                            ctx.fillStyle = laneColors[note.lane];
                            ctx.globalAlpha = 0.75;
                            ctx.beginPath();
                            ctx.roundRect(note.lane * gameData.laneWidth + 12, topY, gameData.laneWidth - 24, drawHeight, 8);
                            ctx.fill();
                            ctx.globalAlpha = 1.0;
                        } else if (topY > gameData.hitLineY && note.wasHit) {
                            note.active = false;
                        }
                    }
                }
            }

            // 판정 텍스트
            if (gameData.judgmentAlpha > 0) {
                ctx.save(); ctx.globalAlpha = gameData.judgmentAlpha; ctx.textAlign = 'center';
                ctx.font = 'bold 38px Orbitron';
                let jColor = gameData.lastJudgment === 'PERFECT' ? '#00e5ff' : (gameData.lastJudgment === 'GREAT' ? '#00ffaa' : '#ff0055');
                ctx.fillStyle = jColor;
                ctx.fillText(gameData.lastJudgment, canvas.width / 2, canvas.height / 2 - 30);
                
                if (gameData.combo > 1) {
                    ctx.font = 'bold 26px Orbitron'; ctx.fillStyle = '#fff';
                    ctx.fillText(`${gameData.combo} COMBO`, canvas.width / 2, canvas.height / 2 + 15);
                }
                ctx.restore(); gameData.judgmentAlpha -= 0.02;
            }

            // 파티클
            for (let i = gameData.particles.length - 1; i >= 0; i--) {
                let p = gameData.particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= p.decay || 0.02;
                if (p.alpha <= 0) { gameData.particles.splice(i, 1); continue; }
                ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            }
        }

        function checkHit(laneIndex) {
            if (!gameData.isPlaying) return;
            if (navigator.vibrate) navigator.vibrate(25); // 💡 세로 조작 시 시원한 터치 진동 피드백

            let currentTime = audioCtx.currentTime - gameData.startTime + 2.0;
            let nearestNote = null;
            let minDiff = Infinity;

            for (let i = 0; i < gameData.notes.length; i++) {
                let note = gameData.notes[i];
                if (note.active && note.lane === laneIndex) {
                    let diff = Math.abs(note.hitTime - currentTime);
                    if (diff < minDiff) { minDiff = diff; nearestNote = note; }
                }
            }

            if (nearestNote) {
                if (minDiff < gameData.hitWindow) {
                    if (nearestNote.type === 'long') nearestNote.wasHit = true;
                    handleSuccess(nearestNote, "PERFECT", 100, laneIndex);
                } else if (minDiff < gameData.greatWindow) {
                    if (nearestNote.type === 'long') nearestNote.wasHit = true;
                    handleSuccess(nearestNote, "GREAT", 60, laneIndex);
                } else if (minDiff < gameData.missWindow) {
                    nearestNote.active = false;
                    handleMiss();
                }
            }
        }

        function handleSuccess(note, type, scoreAdd, laneIndex) {
            if (note.type !== 'long') note.active = false;
            gameData.successCount++; gameData.combo++; gameData.score += scoreAdd;
            scoreBoard.innerText = `SCORE: ${gameData.score}`;
            showJudgment(type); updateStats();

            let laneX = laneIndex * gameData.laneWidth + gameData.laneWidth / 2;
            for (let pNum = 0; pNum < 12; pNum++) {
                gameData.particles.push({
                    x: laneX, y: gameData.hitLineY,
                    vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6 - 2,
                    radius: Math.random() * 5 + 2, alpha: 1, decay: 0.025, color: laneColors[laneIndex]
                });
            }
        }

        function handleMiss() {
            gameData.failCount++; gameData.combo = 0;
            showJudgment("MISS"); updateStats();
        }

        // PC 키보드 입력 매핑
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            const keyMap = { 'd': 0, 'f': 1, 'j': 2, 'k': 3 };
            if (keyMap[key] !== undefined && !keys[keyMap[key]]) {
                keys[keyMap[key]] = true; checkHit(keyMap[key]);
            }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            const keyMap = { 'd': 0, 'f': 1, 'j': 2, 'k': 3 };
            if (keyMap[key] !== undefined) keys[keyMap[key]] = false;
        });

        // 💡 핵심: 세로 화면 가로 분할 터치 조작 매핑 (왼쪽 엄지 1,2번 / 오른쪽 엄지 3,4번 라인 대응)
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // 더블클릭 줌인 확대 현상 완벽 방지
            const rect = canvas.getBoundingClientRect();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                // 화면의 X 좌표를 기준으로 4개의 세로 레인을 판정합니다.
                const x = touch.clientX - rect.left;
                const laneIndex = Math.floor(x / (rect.width / 4));
                if (laneIndex >= 0 && laneIndex < 4) {
                    keys[laneIndex] = true; checkHit(laneIndex);
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const x = touch.clientX - rect.left;
                const laneIndex = Math.floor(x / (rect.width / 4));
                if (laneIndex >= 0 && laneIndex < 4) keys[laneIndex] = false;
            }
        }, { passive: false });

        canvas.addEventListener('touchcancel', () => { keys.fill(false); });
    </script>
